name: Build and Publish to npm

on:
  release:
    types: [published]
  # Manual re-publish. A failed publish cannot be recovered with `gh run rerun`,
  # because a rerun replays the workflow file from the tagged commit — including
  # whatever broke it. Dispatching from a branch uses the current file and the
  # version in that branch's package.json.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FLOWCORE_MACHINE_GITHUB_TOKEN }}
          submodules: true
      - name: Extract version from package.json
        uses: sergeysova/jq-action@v2
        id: version
        with:
          cmd: "jq .version package.json -r"
      - name: Show my version
        run: 'echo "version ${{ steps.version.outputs.value }}"'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build for NPM
        run: bun run build
      # useblacksmith/setup-node, NOT actions/setup-node. The Blacksmith action injects a
      # transient npm token through OIDC. actions/setup-node does not, so it falls back to
      # NODE_AUTH_TOKEN — a classic token, and npm revoked those in March 2025. The symptom
      # is `E404 Not Found - PUT` on a package that plainly exists, because npm answers 404
      # rather than 403 to avoid leaking package existence.
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      # Pinned, not @latest. A floating npm broke this pipeline once already when npm 12
      # raised its own engine requirement above the node version in use.
      - name: Install npm 11
        run: npm install -g npm@11
      # provenance stays off: Blacksmith counts as a self-hosted runner, and npm only
      # supports provenance from GitHub-hosted runners.
      - name: Publish to NPM
        run: npm publish --access public --provenance=false
